name: Build

# Runs the tests, builds the Android APK + web app against the real Firebase
# project (our-challenge-e8f25), and — when the FIREBASE_SERVICE_ACCOUNT
# secret is set — deploys the security rules, database indexes and the web
# app (Firebase Hosting), including the download page with the APK:
# https://our-challenge-e8f25.web.app/download
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      demo:
        description: 'Build the offline demo instead (in-memory data, demo member)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FIREBASE_DEFINE: ${{ inputs.demo && '' || '--dart-define=USE_FIREBASE=true' }}
      # Every build gets the next number (Android versionCode + update check).
      VERSION_FLAGS: --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} --dart-define=APP_BUILD=${{ github.run_number }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Use the permanent signing key
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/goals.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/goals.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_* secrets missing - the APK is signed with a throwaway key and can't update an installed app."
          fi

      - name: Build Android APKs (one per CPU type, for smaller downloads)
        run: flutter build apk --release --split-per-abi $FIREBASE_DEFINE $VERSION_FLAGS

      - name: Build web
        run: flutter build web --release $FIREBASE_DEFINE $VERSION_FLAGS

      - name: Add the APKs and version info to the website
        run: |
          OUT=build/app/outputs/flutter-apk
          mkdir -p build/web/download
          cp "$OUT/app-arm64-v8a-release.apk" build/web/download/goals.apk
          cp "$OUT/app-armeabi-v7a-release.apk" build/web/download/goals-arm32.apk
          printf '{"build": %s, "apk": "/download/goals.apk"}\n' "${{ github.run_number }}" \
            > build/web/download/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/web/download/goals.apk

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web

  deploy:
    # Real builds of the main development branch only.
    needs: build
    if: ${{ !inputs.demo && github.ref == 'refs/heads/claude/lucid-heisenberg-65a7wv' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for the deploy key
        id: key
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT secret not set - skipping deploy."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.key.outputs.present == 'true'
        with:
          name: web
          path: build/web

      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: '22'

      - name: Deploy rules, indexes and web app
        if: steps.key.outputs.present == 'true'
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy \
            --only firestore:rules,firestore:indexes,hosting \
            --project our-challenge-e8f25 --non-interactive --force
