name: Build

# Runs the tests and builds the Android APK + web app on GitHub's servers,
# so no local Android SDK is needed. Download the APK from the run's
# "Artifacts" section (Actions tab → latest run).
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      firebase:
        description: 'Build against the real Firebase project (needs lib/firebase_options.dart from flutterfire configure)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEFINES: ${{ inputs.firebase && '--dart-define=USE_FIREBASE=true' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release $DEFINES

      - name: Build web
        run: flutter build web --release $DEFINES

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
